[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurograph"
version = "0.1.0"
description = "NeuroGraph: a local, source-agnostic personal RAG."
requires-python = ">=3.11"
dependencies = [
    "pydantic",
    "PyYAML",
    "fastembed",
    "chromadb",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/neurograph"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
